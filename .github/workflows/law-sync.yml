name: Law Sync Daily

on:
  schedule:
    - cron: '7 18 * * *' # JST 03:07
  workflow_dispatch:
    inputs:
      ref_json_all:
        description: 'Rebuild all ref_json files'
        required: false
        default: false
        type: boolean

concurrency:
  group: law-sync-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LAWDATA_REF_DIR: public/ref_json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore ref_json manifest cache
        uses: actions/cache/restore@v4
        with:
          path: public/ref_json/_meta.json
          key: ref-json-meta-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ref-json-meta-${{ github.ref_name }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build ref_json incrementally
        run: |
          if [ "${{ github.event.inputs.ref_json_all }}" = "true" ]; then
            python scripts/ref_json/build_ref_json.py --out-dir public/ref_json --all
          else
            python scripts/ref_json/build_ref_json.py --out-dir public/ref_json
          fi

      - name: Save ref_json manifest cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: public/ref_json/_meta.json
          key: ref-json-meta-${{ github.ref_name }}-${{ github.run_id }}

      - name: Apply migration
        run: node scripts/supabase/apply-migration.mjs

      - name: Incremental upsert
        run: node scripts/supabase/upsert-law-data.mjs

      - name: DB keep-alive read
        run: |
          node --input-type=module -e "
          import { createClient } from '@supabase/supabase-js';
          const c = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false }});
          const { error } = await c.from('laws').select('law_num', { head: true, count: 'exact' }).limit(1);
          if (error) throw error;
          console.log('keepalive_ok');
          "
